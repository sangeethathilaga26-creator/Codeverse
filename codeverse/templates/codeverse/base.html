{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Codeverse</title>
    <link rel="icon" href="{% static 'codeverse/images/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'codeverse/css/custom.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
        <img src="{% static 'codeverse/images/codeverse-logo.svg' %}" alt="Codeverse" height="36">
      </a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="text-white me-3">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="{% url 'signup' %}" class="btn btn-light btn-sm">Signup</a>
        {% endif %}
      </div>
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
